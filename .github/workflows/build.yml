name: Build B-Z

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Self-test
        run: npm test

      - name: Build installer + portable exe
        run: npm run build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: B-Z-windows
          path: |
            dist/B-Z-Setup-*.exe
            dist/B-Z-Portable-*.exe
          if-no-files-found: error

      - name: Publish release (on version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/B-Z-Setup-*.exe
            dist/B-Z-Portable-*.exe
          generate_release_notes: true
